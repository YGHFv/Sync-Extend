[workspace]
members = ["crates/core-model", "crates/cas", "crates/journal", "crates/reconcile", "crates/daemon"]
exclude = ["tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
fastcdc = "5.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
