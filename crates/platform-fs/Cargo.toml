[package]
name = "sync-extend-platform-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
