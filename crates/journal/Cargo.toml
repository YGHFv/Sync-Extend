[package]
name = "sync-extend-journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
fault-injection = []

[dependencies]
sync-extend-core-model = { path = "../core-model" }
sync-extend-transport = { path = "../transport" }
blake3.workspace = true
ed25519-dalek.workspace = true
rusqlite = { workspace = true, features = ["functions", "cache", "backup", "serialize", "hooks", "limits"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
sync-extend-platform-fs = { path = "../platform-fs" }

[target.'cfg(target_os = "linux")'.dependencies]
sync-extend-platform-fs = { path = "../platform-fs" }

[target.'cfg(target_os = "android")'.dependencies]
fs2.workspace = true
sync-extend-platform-fs = { path = "../platform-fs" }

[lints]
workspace = true
